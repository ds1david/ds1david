name: Gateway POC tests
on:
  push:
    paths: ['gateway-poc/**', '.github/workflows/gateway-poc-tests.yml']
  pull_request:
    paths: ['gateway-poc/**', '.github/workflows/gateway-poc-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-https.txt
        working-directory: gateway-poc
      - run: python -m unittest discover -s tests -v
        working-directory: gateway-poc
