# Merge/review with the host HAProxy configuration; do not overwrite unrelated routes.
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 64

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 75s
    timeout server 75s

frontend secure_gateway
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend agent_https if { req.ssl_sni -i agent-gateway.sicredi.space }
    use_backend client_mtls if { req.ssl_sni -i secure-gateway.sicredi.space }
    # Unknown SNI has no backend and is rejected.

backend agent_https
    server agent 127.0.0.1:9444

backend client_mtls
    server clients 127.0.0.1:9443
